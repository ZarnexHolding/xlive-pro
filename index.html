<!doctype html>
<html lang="en" class="pre-hydrate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/xlive-logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050609" />
    <meta name="keywords" content="event production company Saudi Arabia, event production Riyadh, exhibition contractor KSA, event execution partner Saudi, AV production Saudi Arabia" />
    <meta property="og:site_name" content="XLIVE Production" />

    <!-- Per-route <title> / description / canonical / OG / Twitter come from the Seo component (React 19 head tags), prerendered per route at build time. -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "XLIVE Production",
        "alternateName": "XLIVE",
        "url": "https://xlive-pro.com",
        "logo": "https://xlive-pro.com/xlive-logo.webp",
        "description": "Saudi Arabia's fully integrated event production and experience engineering company: live events, exhibitions, branding, fabrication and immersive experiences.",
        "telephone": "+966534307007",
        "parentOrganization": { "@type": "Organization", "name": "Zarnex Holding Company" },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Abdul Aziz Bin Sabil Street, Al Farooq District 6485",
          "addressLocality": "Riyadh",
          "addressCountry": "SA"
        },
        "areaServed": ["Saudi Arabia", "Riyadh", "Jeddah", "NEOM"]
      }
    </script>

    <!-- LCP: the hero poster paints first; the video streams in afterwards. -->
    <link rel="preload" as="image" href="/images/hero-poster.webp" type="image/webp" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint (swap in when ready). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <!-- Safety net: if the app never hydrates, reveal the hero copy anyway. -->
    <script>setTimeout(function () { document.documentElement.classList.remove('pre-hydrate') }, 4000)</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
